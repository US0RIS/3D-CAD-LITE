name: Build ForgeCAD v1 Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - forgecad-release-package-final2
    paths:
      - "v1/release-b64/**"
      - ".github/workflows/windows-v1-build.yml"

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify release source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedPartHashes = @(
            "d987501021a90c5d185f3efb22ccf02c82c3a43bb68d610939b4c94f05c26950",
            "730fe01493f6d5ddb91ae28acfee07af428180d4b35c96c6e304c3738efb6322",
            "153d06c4e75f3bd1462f9d2af126d27ac0a82e2ed3bb96ccfb6eb16b87c85643",
            "b83135086ff205db151c6d5d932abed584c51e25ee3a1c1c647d72484e04c5e3"
          )
          $parts = 0..3 | ForEach-Object {
            $path = Join-Path $env:GITHUB_WORKSPACE ("v1/release-b64/part{0:D2}.txt" -f $_)
            if (-not (Test-Path $path)) { throw "Missing release source part: $path" }
            $text = (Get-Content $path -Raw).Trim()
            $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($text))).ToLowerInvariant()
            Write-Host ("part{0:D2}: chars={1} sha256={2}" -f $_, $text.Length, $sha)
            if ($sha -ne $expectedPartHashes[$_]) { throw ("Release source part{0:D2} SHA256 mismatch: {1}" -f $_, $sha) }
            $text
          }
          $b64 = $parts -join ""
          $bytes = [Convert]::FromBase64String($b64)
          $src = Join-Path $env:GITHUB_WORKSPACE "ForgeCAD-v1-source.zip"
          [IO.File]::WriteAllBytes($src, $bytes)
          if ((Get-Item $src).Length -ne 47969) { throw "Release snapshot length mismatch" }
          $hash = (Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "19c4c3bf864ca487088b8efc45dbb49b2b0ab1b91179f4cd133e55c937dd269b") {
            throw "Release snapshot SHA256 mismatch: $hash"
          }
          $dst = Join-Path $env:GITHUB_WORKSPACE "v1-build-src"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive -Path $src -DestinationPath $dst -Force
          if (-not (Test-Path (Join-Path $dst "server.py"))) { throw "Snapshot extraction did not produce server.py" }
          Write-Host "Verified release source: $hash"

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install test-client compatibility dependency
        shell: pwsh
        run: python -m pip install "httpx2>=0.1"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows application and installer
        shell: pwsh
        working-directory: v1-build-src
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/build.ps1

      - name: Install and smoke-test packaged installer
        shell: pwsh
        working-directory: v1-build-src
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/ci_installer_smoke.ps1

      - name: Show release hashes
        shell: pwsh
        working-directory: v1-build-src
        run: |
          Get-FileHash dist/installer/ForgeCAD-Setup.exe -Algorithm SHA256
          Get-Item dist/installer/ForgeCAD-Setup.exe | Select-Object Name,Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ForgeCAD-v1-Windows-Setup
          path: v1-build-src/dist/installer/ForgeCAD-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ForgeCAD-v1-Windows-x64
          path: v1-build-src/dist/ForgeCAD-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
