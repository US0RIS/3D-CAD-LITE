name: ForgeCAD v1.1.1 real-component agent policy

on:
  push:
    branches: [forgecad-v1.1.1-dev]
    paths:
      - "v1.1/base/agents.py"
      - "v1.1/base/component_agent_policy_test.py"
      - "v1.1/base/component_registry.py"
      - "v1.1/base/curated_catalog.py"
      - ".github/workflows/v111-agent-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile agent and registry
        working-directory: v1.1/base
        run: python -m compileall -q agents.py component_registry.py curated_catalog.py component_agent_policy_test.py
      - name: Test exact-part candidate retrieval
        working-directory: v1.1/base
        run: python component_agent_policy_test.py
