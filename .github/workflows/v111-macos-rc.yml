name: Build ForgeCAD v1.1.1 macOS release candidate

on:
  workflow_dispatch:
  push:
    branches: [forgecad-v1.1.1-dev]
    paths:
      - ".github/workflows/v111-macos-rc.yml"
      - "v1.1/base/**"

permissions:
  contents: read

concurrency:
  group: forgecad-v1.1.1-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.1-dev
      - name: Verify Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and smoke-test ForgeCAD v1.1.1
        shell: bash
        working-directory: v1.1/base
        run: bash macos/build.sh
      - name: Verify candidate version, bundle metadata and artifacts
        shell: bash
        working-directory: v1.1/base
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import core; print(core.APP_VERSION)')"
          test "$VERSION" = "1.1.1"
          test -f "dist/ForgeCAD-v${VERSION}-macOS-arm64.dmg"
          test -f "dist/ForgeCAD-v${VERSION}-macOS-arm64-app.zip"
          PLIST="dist/ForgeCAD.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "1.1.1"
          shasum -a 256 "dist/ForgeCAD-v${VERSION}-macOS-arm64.dmg" "dist/ForgeCAD-v${VERSION}-macOS-arm64-app.zip"
      - name: Verify bundled authoritative component assets
        shell: bash
        working-directory: v1.1/base
        run: |
          set -euo pipefail
          find dist/ForgeCAD.app -type f -name 'raspberry_pi_5_official.step' -size +100k | grep -q .
          find dist/ForgeCAD.app -type f -name 'raspberry_pi_4_model_b_parametric.step' -size +100k | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeCAD-v1.1.1-macOS-release-candidate
          path: |
            v1.1/base/dist/ForgeCAD-v1.1.1-macOS-arm64.dmg
            v1.1/base/dist/ForgeCAD-v1.1.1-macOS-arm64-app.zip
          if-no-files-found: error
          retention-days: 30
