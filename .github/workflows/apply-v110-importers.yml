name: Apply ForgeCAD v1.1 vendor importers

on:
  push:
    branches: [forgecad-v1.1.0-dev]
    paths:
      - "v1.1/extend_v110_importers.py"
      - ".github/workflows/apply-v110-importers.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v110-importers]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.0-dev
          fetch-depth: 0
      - run: python v1.1/extend_v110_importers.py v1.1/base
      - run: python -m compileall -q v1.1/base && node --check v1.1/base/static/app.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v1.1/base/server.py v1.1/base/static/app.js
          git commit -m "Expose vendor STEP component importer [v110-importers]"
          git pull --rebase origin forgecad-v1.1.0-dev
          git push origin HEAD:forgecad-v1.1.0-dev
