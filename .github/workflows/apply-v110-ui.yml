name: Apply ForgeCAD v1.1 component UI

on:
  push:
    branches: [forgecad-v1.1.0-dev]
    paths:
      - "v1.1/integrate_v110_ui.py"
      - ".github/workflows/apply-v110-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v110-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.0-dev
          fetch-depth: 0
      - name: Apply UI patch
        run: python v1.1/integrate_v110_ui.py v1.1/base
      - name: Basic JavaScript syntax guard
        run: node --check v1.1/base/static/app.js
      - name: Commit UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v1.1/base/static/app.js v1.1/base/static/styles.css
          git commit -m "Add provenance-aware real component UI [v110-ui]"
          git pull --rebase origin forgecad-v1.1.0-dev
          git push origin HEAD:forgecad-v1.1.0-dev
