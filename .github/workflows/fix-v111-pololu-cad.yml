name: Fix ForgeCAD v1.1.1 Pololu CAD blocker

on:
  push:
    branches:
      - forgecad-v1.1.1-dev
    paths:
      - .github/workflows/fix-v111-pololu-cad.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.1-dev
          fetch-depth: 0

      - name: Apply official Pololu CAD repair
        run: python v1.1/tools/patch_pololu_cad.py

      - name: Commit repaired v1.1.1 sources
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-v111-pololu-cad.yml v1.1/tools/patch_pololu_cad.py
          git config user.name "ForgeCAD Release Bot"
          git config user.email "actions@github.com"
          git add v1.1/base/prepare_component_assets.py v1.1/base/curated_catalog.py
          git commit -m "Bundle official Pololu CAD for v1.1.1"
          git push origin HEAD:forgecad-v1.1.1-dev
