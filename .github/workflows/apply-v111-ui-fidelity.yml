name: Apply v1.1.1 component fidelity UI

on:
  push:
    branches: [forgecad-v1.1.1-dev]
    paths:
      - ".github/workflows/apply-v111-ui-fidelity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.1-dev
          fetch-depth: 0
      - name: Make proxy status impossible to miss
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('v1.1/base/static/app.js');s=p.read_text(encoding='utf-8')

          old='''<button data-add="${esc(c.id)}">Add</button><small>${esc(c.category)} • ${c.dimensions_mm?.join(' × ')||'?'} mm${c.mass_g!=null?' • '+c.mass_g+' g':''}${c.manufacturer_part_number?' • '+esc(c.manufacturer_part_number):''}</small><small><span class="fidelityBadge">${esc(c.geometry?.fidelity||'unknown')}</span> <span class="trustBadge">trust ${c.trust_score??0}</span> • ${(c.interfaces||[]).length} interfaces</small>'''
          new='''<button data-add="${esc(c.id)}">${(c.manufacturer==='Generic'||['mechanical_envelope','bounding_box','none'].includes(c.geometry?.fidelity))?'Add proxy':'Add real part'}</button><small>${esc(c.category)} • ${c.dimensions_mm?.join(' × ')||'?'} mm${c.mass_g!=null?' • '+c.mass_g+' g':''}${c.manufacturer_part_number?' • '+esc(c.manufacturer_part_number):''}</small><small><span class="fidelityBadge">${esc(c.geometry?.fidelity||'unknown')}</span> <span class="trustBadge">trust ${c.trust_score??0}</span> • ${(c.geometry?.assets||[]).filter(a=>a.role==='geometry').length} CAD asset(s) • ${(c.interfaces||[]).length} interfaces${(c.manufacturer==='Generic'||['mechanical_envelope','bounding_box','none'].includes(c.geometry?.fidelity))?' • ⚠ PROXY GEOMETRY':''}</small>'''
          if s.count(old)!=1:raise SystemExit(f'component card target count {s.count(old)}')
          s=s.replace(old,new,1)

          old2='''$$('[data-add]').forEach(b=>b.onclick=async()=>{await api('/api/components/add/'+encodeURIComponent(b.dataset.add),{method:'POST'});await refresh({geometry:true})})'''
          new2='''$$('[data-add]').forEach(b=>b.onclick=async()=>{const c=r.results.find(x=>x.id===b.dataset.add);const proxy=c&&(c.manufacturer==='Generic'||['mechanical_envelope','bounding_box','none'].includes(c.geometry?.fidelity));if(proxy&&!confirm(`${c.name} does not have final real-part CAD. Add its clearly marked proxy geometry for conceptual layout only?`))return;await api('/api/components/add/'+encodeURIComponent(b.dataset.add),{method:'POST'});await refresh({geometry:true})})'''
          if s.count(old2)!=1:raise SystemExit(f'add handler target count {s.count(old2)}')
          s=s.replace(old2,new2,1)

          old3='''<span class="fidelityBadge">${esc(c?.geometry?.fidelity||'unknown')} geometry</span> <span class="trustBadge">trust ${c?.trust_score??0}/100</span><br><small>Vendor/purchased dimensions are read-only. Replace or sync the component instead of deforming it.</small>'''
          new3='''<span class="fidelityBadge">${esc(c?.geometry?.fidelity||'unknown')} geometry</span> <span class="trustBadge">trust ${c?.trust_score??0}/100</span><br><small>${(c?.geometry?.assets||[]).filter(a=>a.role==='geometry').length} registered CAD asset(s)${c?.provenance?.[0]?.title?' • '+esc(c.provenance[0].title):''}</small><br><small>${(c?.manufacturer==='Generic'||['mechanical_envelope','bounding_box','none'].includes(c?.geometry?.fidelity))?'⚠ Proxy geometry: do not treat this shape as production fit authority.':'Purchased dimensions are read-only. Replace or sync the component instead of deforming it.'}</small>'''
          if s.count(old3)!=1:raise SystemExit(f'inspector target count {s.count(old3)}')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit UI fidelity guardrails
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v1.1/base/static/app.js
          git commit -m "Make proxy geometry explicit in component UI" || exit 0
          git fetch origin forgecad-v1.1.1-dev
          git rebase origin/forgecad-v1.1.1-dev
          git push origin HEAD:forgecad-v1.1.1-dev
