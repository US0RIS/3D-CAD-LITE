name: Apply ForgeCAD v1.1 canonical integration

on:
  push:
    branches: [forgecad-v1.1.0-dev]
    paths:
      - "v1.1/APPLY_INTEGRATION"
      - "v1.1/integrate_v110.py"
      - ".github/workflows/apply-v110-integration.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v110-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.0-dev
          fetch-depth: 0
      - name: Apply integration patch
        run: python v1.1/integrate_v110.py v1.1/base
      - name: Compile patched source
        run: python -m compileall -q v1.1/base
      - name: Commit integrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v1.1/base/core.py
          git commit -m "Integrate real-world components into canonical model [v110-integrated]"
          git pull --rebase origin forgecad-v1.1.0-dev
          git push origin HEAD:forgecad-v1.1.0-dev
