name: Apply ForgeCAD v1.1 acceptance UI

on:
  push:
    branches: [forgecad-v1.1.0-dev]
    paths:
      - "v1.1/apply_acceptance_ui.py"
      - ".github/workflows/apply-v110-acceptance-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v110-acceptance-ui-integrated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.0-dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply acceptance UI patch
        run: python v1.1/apply_acceptance_ui.py v1.1/base
      - name: Validate JavaScript syntax and contract markers
        run: |
          cp v1.1/base/static/app.js /tmp/forgecad-app.mjs
          node --check /tmp/forgecad-app.mjs
          grep -q 'id="acceptanceBtn"' v1.1/base/static/app.js
          grep -q '/api/templates/v1.1-acceptance' v1.1/base/static/app.js
          grep -q 'Physical assembly' v1.1/base/static/app.js
      - name: Commit integrated UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v1.1/base/static/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expose v1.1 acceptance assembly in desktop UI [v110-acceptance-ui-integrated]"
          git fetch origin forgecad-v1.1.0-dev
          git rebase origin/forgecad-v1.1.0-dev
          git push origin HEAD:forgecad-v1.1.0-dev
