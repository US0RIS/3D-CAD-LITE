name: Publish ForgeCAD v1.1.1 Release

on:
  workflow_run:
    workflows:
      - ForgeCAD v1.1.1 qualification CI
      - Build ForgeCAD v1.1.1 macOS release candidate
      - Build ForgeCAD v1.1.1 Windows release candidate
    types: [completed]
    branches: [forgecad-v1.1.1-dev]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: forgecad-v1.1.1-release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve fully qualified v1.1.1 build set
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: forgecad-v1.1.1-dev
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh api "repos/$REPO/branches/$BRANCH" --jq '.commit.sha')
          CI_RUN=$(gh api "repos/$REPO/actions/workflows/356116567/runs?branch=$BRANCH&head_sha=$HEAD_SHA&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')
          MAC_RUN=$(gh api "repos/$REPO/actions/workflows/356116673/runs?branch=$BRANCH&head_sha=$HEAD_SHA&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')
          WIN_RUN=$(gh api "repos/$REPO/actions/workflows/356116746/runs?branch=$BRANCH&head_sha=$HEAD_SHA&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')
          if [[ -z "$CI_RUN" || -z "$MAC_RUN" || -z "$WIN_RUN" ]]; then
            echo "Matching successful CI/macOS/Windows runs are not all complete for $HEAD_SHA."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "ci_run=$CI_RUN" >> "$GITHUB_OUTPUT"
          echo "mac_run=$MAC_RUN" >> "$GITHUB_OUTPUT"
          echo "win_run=$WIN_RUN" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download qualified native installers
        if: steps.runs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAC_RUN: ${{ steps.runs.outputs.mac_run }}
          WIN_RUN: ${{ steps.runs.outputs.win_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/mac release/win
          gh run download "$MAC_RUN" --repo "$REPO" -n ForgeCAD-v1.1.1-macOS-release-candidate -D release/mac
          gh run download "$WIN_RUN" --repo "$REPO" -n ForgeCAD-v1.1.1-Windows-release-candidate -D release/win
          DMG=$(find release/mac -type f -name 'ForgeCAD-v1.1.1-macOS-arm64.dmg' -print -quit)
          APP_ZIP=$(find release/mac -type f -name 'ForgeCAD-v1.1.1-macOS-arm64-app.zip' -print -quit)
          EXE=$(find release/win -type f -name 'ForgeCAD-Setup.exe' -print -quit)
          test -n "$DMG" && test -s "$DMG"
          test -n "$APP_ZIP" && test -s "$APP_ZIP"
          test -n "$EXE" && test -s "$EXE"
          cp "$EXE" release/ForgeCAD-v1.1.1-Windows-x64-Setup.exe
          sha256sum "$DMG" "$APP_ZIP" release/ForgeCAD-v1.1.1-Windows-x64-Setup.exe | sed 's#release/mac/##;s#release/##' > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Publish stable ForgeCAD v1.1.1 release
        if: steps.runs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.runs.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find release/mac -type f -name 'ForgeCAD-v1.1.1-macOS-arm64.dmg' -print -quit)
          APP_ZIP=$(find release/mac -type f -name 'ForgeCAD-v1.1.1-macOS-arm64-app.zip' -print -quit)
          EXE=release/ForgeCAD-v1.1.1-Windows-x64-Setup.exe
          NOTES=$(cat <<'EOF'
          ForgeCAD v1.1.1 is the production-fidelity maintenance release for the v1.1 engineering workbench.

          Highlights:
          - Manufacturer-authoritative Raspberry Pi 5 STEP geometry is bundled and used for engineering operations.
          - Raspberry Pi 4 Model B receives a detailed mechanically useful board model derived from official mechanical data.
          - Viewport representation and engineering-authority geometry are separated so recognizable visuals do not compromise collision/export authority.
          - Generic/envelope geometry is explicitly marked as proxy geometry and cannot silently masquerade as a requested commercial part.
          - Purchased parts retain immutable registry identity, provenance, interfaces and geometry fidelity.
          - Agent component selection is constrained to registry-backed real parts for exact-part requests.
          - Production-readiness checks gate physical verification and surface unresolved proxy/fidelity/provenance issues.
          - macOS and Windows packages are built only after the complete deterministic regression, acceptance, component-fidelity and production-readiness suites pass for the same commit.

          macOS builds are ad-hoc signed but not Apple-notarized. Windows builds are currently unsigned. Validate safety-critical designs independently; ForgeCAD analysis and automated checks remain engineering screening tools rather than certification.
          EOF
          )
          if ! gh release view forgecad-v1.1.1 --repo "$REPO" >/dev/null 2>&1; then
            gh release create forgecad-v1.1.1 --repo "$REPO" --target "$HEAD_SHA" --title "ForgeCAD v1.1.1" --notes "$NOTES"
          else
            gh release edit forgecad-v1.1.1 --repo "$REPO" --target "$HEAD_SHA" --title "ForgeCAD v1.1.1" --notes "$NOTES"
          fi
          gh release upload forgecad-v1.1.1 --repo "$REPO" \
            "$DMG#ForgeCAD v1.1.1 macOS Apple Silicon DMG" \
            "$APP_ZIP#ForgeCAD v1.1.1 macOS Apple Silicon app ZIP" \
            "$EXE#ForgeCAD v1.1.1 Windows x64 Setup" \
            "release/SHA256SUMS.txt#SHA-256 checksums" --clobber

      - name: Freeze qualified source and verify published release
        if: steps.runs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.runs.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          STABLE_BRANCH=forgecad-release-v1.1.1
          if gh api "repos/$REPO/git/ref/heads/$STABLE_BRANCH" >/dev/null 2>&1; then
            CURRENT=$(gh api "repos/$REPO/git/ref/heads/$STABLE_BRANCH" --jq '.object.sha')
            test "$CURRENT" = "$HEAD_SHA" || {
              echo "Stable branch already exists at unexpected SHA $CURRENT (wanted $HEAD_SHA)."
              exit 1
            }
          else
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/heads/$STABLE_BRANCH" -f sha="$HEAD_SHA" >/dev/null
          fi

          TAG_SHA=$(gh api "repos/$REPO/git/ref/tags/forgecad-v1.1.1" --jq '.object.sha')
          test "$TAG_SHA" = "$HEAD_SHA"

          ASSETS=$(gh release view forgecad-v1.1.1 --repo "$REPO" --json assets --jq '.assets[].name')
          for REQUIRED in \
            ForgeCAD-v1.1.1-macOS-arm64.dmg \
            ForgeCAD-v1.1.1-macOS-arm64-app.zip \
            ForgeCAD-v1.1.1-Windows-x64-Setup.exe \
            SHA256SUMS.txt; do
            grep -Fxq "$REQUIRED" <<<"$ASSETS" || { echo "Missing release asset: $REQUIRED"; exit 1; }
          done

          echo "Qualified SHA: $HEAD_SHA"
          cat release/SHA256SUMS.txt
          gh release view forgecad-v1.1.1 --repo "$REPO" --json url,tagName,targetCommitish,assets
