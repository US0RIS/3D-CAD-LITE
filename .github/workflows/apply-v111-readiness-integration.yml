name: Apply v1.1.1 production readiness integration

on:
  push:
    branches: [forgecad-v1.1.1-dev]
    paths:
      - ".github/workflows/apply-v111-readiness-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.1-dev
          fetch-depth: 0
      - name: Apply production-readiness API and UI integration
        run: python v1.1/tools/apply_readiness_integration.py
      - name: Syntax check Python integration
        run: python -m compileall -q v1.1/base/server.py v1.1/base/production_readiness.py
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v1.1/base/server.py v1.1/base/static/index.html v1.1/base/static/app.js
          git commit -m "Gate physical verification on production-ready geometry"
          git fetch origin forgecad-v1.1.1-dev
          git rebase origin/forgecad-v1.1.1-dev
          git push origin HEAD:forgecad-v1.1.1-dev
