name: Apply v1.1.1 Raspberry Pi visual fidelity

on:
  push:
    branches: [forgecad-v1.1.1-dev]
    paths:
      - ".github/workflows/apply-v111-rpi-visual-fidelity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.1-dev
          fetch-depth: 0
      - name: Apply visual fidelity patch
        run: python v1.1/tools/apply_rpi_visual_patch.py
      - name: Syntax check
        run: python -m compileall -q v1.1/base/physical_components.py
      - name: Commit visual fidelity changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v1.1/base/physical_components.py
          git commit -m "Improve Raspberry Pi connector visual fidelity"
          git fetch origin forgecad-v1.1.1-dev
          git rebase origin/forgecad-v1.1.1-dev
          git push origin HEAD:forgecad-v1.1.1-dev
