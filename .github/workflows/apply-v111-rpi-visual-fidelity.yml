name: Apply v1.1.1 Raspberry Pi visual fidelity

on:
  push:
    branches: [forgecad-v1.1.1-dev]
    paths:
      - ".github/workflows/apply-v111-rpi-visual-fidelity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.1-dev
          fetch-depth: 0
      - name: Add connector faces and board detail
