        _box(0.9, 10.6, 5.2, "#17191b", (47.05, -1.0, 12.2), 0.25),   # USB3 upper mouth
        _box(1.3, 7.6, 1.15, "#1878c8", (47.35, -1.0, 5.0), 0.15),   # USB3 blue tongue
        _box(1.3, 7.6, 1.15, "#1878c8", (47.35, -1.0, 12.2), 0.15),  # USB3 blue tongue
