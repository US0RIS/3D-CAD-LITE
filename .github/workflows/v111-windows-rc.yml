name: Build ForgeCAD v1.1.1 Windows release candidate

on:
  workflow_dispatch:
  push:
    branches: [forgecad-v1.1.1-dev]
    paths:
      - ".github/workflows/v111-windows-rc.yml"
      - "v1.1/base/**"

permissions:
  contents: read

concurrency:
  group: forgecad-v1.1.1-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build and smoke-test ForgeCAD v1.1.1
        shell: pwsh
        working-directory: v1.1/base
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/build.ps1
      - name: Install and smoke-test packaged candidate
        shell: pwsh
        working-directory: v1.1/base
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/ci_installer_smoke.ps1
      - name: Verify candidate version, assets and hash
        shell: pwsh
        working-directory: v1.1/base
        run: |
          $Version = (python -c "import core; print(core.APP_VERSION)").Trim()
          if ($Version -ne "1.1.1") { throw "Expected ForgeCAD 1.1.1, got $Version" }
          $Installer = "dist/installer/ForgeCAD-Setup.exe"
          if (-not (Test-Path $Installer)) { throw "Installer missing" }
          $Pi5 = Get-ChildItem -Path "dist/ForgeCAD" -Recurse -Filter "raspberry_pi_5_official.step" | Select-Object -First 1
          $Pi4 = Get-ChildItem -Path "dist/ForgeCAD" -Recurse -Filter "raspberry_pi_4_model_b_parametric.step" | Select-Object -First 1
          if (-not $Pi5 -or $Pi5.Length -lt 100000) { throw "Bundled Pi 5 authoritative CAD missing" }
          if (-not $Pi4 -or $Pi4.Length -lt 100000) { throw "Bundled Pi 4 CAD missing" }
          Get-FileHash $Installer -Algorithm SHA256
          Get-Item $Installer | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeCAD-v1.1.1-Windows-release-candidate
          path: v1.1/base/dist/installer/ForgeCAD-Setup.exe
          if-no-files-found: error
          retention-days: 30
