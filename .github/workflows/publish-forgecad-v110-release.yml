name: Publish ForgeCAD v1.1.0 Release

on:
  workflow_run:
    workflows:
      - ForgeCAD v1.1 development CI
      - Build ForgeCAD v1.1 macOS release candidate
      - Build ForgeCAD v1.1 Windows release candidate
    types: [completed]
    branches: [forgecad-v1.1.0-dev]

permissions:
  contents: write
  actions: read

concurrency:
  group: forgecad-v1.1.0-release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve fully qualified v1.1.0 build set
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: forgecad-v1.1.0-dev
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh api "repos/$REPO/branches/$BRANCH" --jq '.commit.sha')
          CI_RUN=$(gh api "repos/$REPO/actions/workflows/v110-ci.yml/runs?branch=$BRANCH&head_sha=$HEAD_SHA&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')
          MAC_RUN=$(gh api "repos/$REPO/actions/workflows/v110-macos-rc.yml/runs?branch=$BRANCH&head_sha=$HEAD_SHA&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')
          WIN_RUN=$(gh api "repos/$REPO/actions/workflows/v110-windows-rc.yml/runs?branch=$BRANCH&head_sha=$HEAD_SHA&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')
          if [[ -z "$CI_RUN" || -z "$MAC_RUN" || -z "$WIN_RUN" ]]; then
            echo "A matching successful CI/macOS/Windows build set is not complete yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "ci_run=$CI_RUN" >> "$GITHUB_OUTPUT"
          echo "mac_run=$MAC_RUN" >> "$GITHUB_OUTPUT"
          echo "win_run=$WIN_RUN" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download qualified native installers
        if: steps.runs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAC_RUN: ${{ steps.runs.outputs.mac_run }}
          WIN_RUN: ${{ steps.runs.outputs.win_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/mac release/win
          gh run download "$MAC_RUN" --repo "$REPO" -n ForgeCAD-v1.1-macOS-release-candidate -D release/mac
          gh run download "$WIN_RUN" --repo "$REPO" -n ForgeCAD-v1.1-Windows-release-candidate -D release/win
          DMG=$(find release/mac -type f -name 'ForgeCAD-v1.1.0-macOS-arm64.dmg' -print -quit)
          APP_ZIP=$(find release/mac -type f -name 'ForgeCAD-v1.1.0-macOS-arm64-app.zip' -print -quit)
          EXE=$(find release/win -type f -name 'ForgeCAD-Setup.exe' -print -quit)
          test -n "$DMG" && test -s "$DMG"
          test -n "$APP_ZIP" && test -s "$APP_ZIP"
          test -n "$EXE" && test -s "$EXE"
          sha256sum "$DMG" "$APP_ZIP" "$EXE"

      - name: Publish stable ForgeCAD v1.1.0 release
        if: steps.runs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.runs.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find release/mac -type f -name 'ForgeCAD-v1.1.0-macOS-arm64.dmg' -print -quit)
          APP_ZIP=$(find release/mac -type f -name 'ForgeCAD-v1.1.0-macOS-arm64-app.zip' -print -quit)
          EXE=$(find release/win -type f -name 'ForgeCAD-Setup.exe' -print -quit)
          if ! gh release view forgecad-v1.1.0 --repo "$REPO" >/dev/null 2>&1; then
            gh release create forgecad-v1.1.0 --repo "$REPO" --target "$HEAD_SHA" --title "ForgeCAD v1.1.0" --notes "ForgeCAD v1.1.0 is the stable v1.1 engineering workbench release. It includes the expanded real-world component layer, physical assembly validation, branch/history workflows, embedded device-code workspaces, analysis and optimization tooling, Jarvis integration, and the v1.1 acceptance assembly. The release is published only when the regression/acceptance suite and both native packaged-app smoke tests succeed for the same commit."
          fi
          gh release upload forgecad-v1.1.0 --repo "$REPO" "$DMG#ForgeCAD v1.1.0 macOS Apple Silicon DMG" "$APP_ZIP#ForgeCAD v1.1.0 macOS Apple Silicon app ZIP" "$EXE#ForgeCAD v1.1.0 Windows x64 Setup" --clobber
          gh release view forgecad-v1.1.0 --repo "$REPO" --json url,tagName,targetCommitish,assets
