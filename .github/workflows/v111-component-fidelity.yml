name: ForgeCAD v1.1.1 component fidelity qualification

on:
  push:
    branches: [forgecad-v1.1.1-dev]
    paths:
      - "v1.1/base/prepare_component_assets.py"
      - "v1.1/base/component_fidelity_test.py"
      - "v1.1/base/curated_catalog.py"
      - "v1.1/base/component_registry.py"
      - "v1.1/base/physical_components.py"
      - "v1.1/base/forgecad.spec"
      - "v1.1/base/macos/build.sh"
      - "v1.1/base/windows/build.ps1"
      - ".github/workflows/v111-component-fidelity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-fidelity-build:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.1-dev
      - name: Verify Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, test, and package ForgeCAD with real component CAD
        working-directory: v1.1/base
        shell: bash
        run: bash macos/build.sh
      - name: Verify bundled component assets survived packaging
        working-directory: v1.1/base
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/ForgeCAD.app/Contents/Resources/component_assets/raspberry_pi_5_official.step
          test -f dist/ForgeCAD.app/Contents/Resources/component_assets/raspberry_pi_4_model_b_parametric.step
          test $(stat -f%z dist/ForgeCAD.app/Contents/Resources/component_assets/raspberry_pi_5_official.step) -gt 1000000
          test $(stat -f%z dist/ForgeCAD.app/Contents/Resources/component_assets/raspberry_pi_4_model_b_parametric.step) -gt 100000
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeCAD-v1.1.1-fidelity-macOS
          path: v1.1/base/dist/ForgeCAD-v1.1.0-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 14
