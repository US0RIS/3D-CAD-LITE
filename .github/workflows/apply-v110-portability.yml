name: Apply ForgeCAD v1.1 project portability

on:
  push:
    branches: [forgecad-v1.1.0-dev]
    paths:
      - "v1.1/integrate_v110_portability.py"
      - ".github/workflows/apply-v110-portability.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v110-portable]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad-v1.1.0-dev
          fetch-depth: 0
      - run: python v1.1/integrate_v110_portability.py v1.1/base
      - run: python -m compileall -q v1.1/base
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v1.1/base/component_registry.py v1.1/base/physical_components.py v1.1/base/server.py
          git commit -m "Make component assets and project bundles portable [v110-portable]"
          git pull --rebase origin forgecad-v1.1.0-dev
          git push origin HEAD:forgecad-v1.1.0-dev
